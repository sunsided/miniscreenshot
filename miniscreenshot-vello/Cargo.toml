[package]
name = "miniscreenshot-vello"
version = "0.3.0"
edition = "2021"
description = "Vello screenshot helper for the miniscreenshot ecosystem. Re-exports vello."
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "EUPL-1.2 OR MIT OR Apache-2.0"
repository = "https://github.com/sunsided/miniscreenshot"
keywords = ["screenshot", "vello", "screenshot-helper"]
categories = ["multimedia::images", "graphics"]
readme = "../README.md"

[dependencies]
miniscreenshot = { version = "0.3", path = "../miniscreenshot" }
# Select the wgpu compatibility track through miniscreenshot-wgpu.
# vello 0.9 builds against wgpu 29, so pin the wgpu-29 track here.
miniscreenshot-wgpu = { version = "0.3", path = "../miniscreenshot-wgpu", default-features = false, features = ["wgpu-29"] }
vello = "0.9"

[dev-dependencies]
pollster = "1.0"
